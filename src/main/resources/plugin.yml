main: dev.boooiil.historia.core.HistoriaCore
name: Historia
version: 1.0
description: Something simple, I guess!
authors: [ boooiil, RedSkilZZ, UnholyRuby ]
api-version: 1.19
author: boooiil
load: STARTUP
loadbefore:
  - Historia-Spawnkill
  - Historia-RMushroom
  - Historia-Combat
softdepend: [ WorldGuard, Towny, Vault, Historia-Spawnkill ]


commands:
  checkplayers:
    description: Get class information from all users.
    usage: /<command> <player>
    permission: historia.checkplayers
  debug:
    description: Get debug information.
    usage: /<command> [player] <args...>
    permission: historia.debug
  stats:
    description: Get the stats of a player.
    usage: /<command> <player>
    permission: historia.stats
  set:
    description: Adjust stuff.
    usage: /<command> <number>
    permission: historia.set
  proficiency:
    description: Adjust stuff.
    usage: /<command> set <player> <proficiency>
    permission: historia.proficiency
  dump:
    description: Dump data to console.
    usage: /<command> <player>
    permission: historia.dump
  settemperature:
    description: Set temperature for a player
    usage: /settemperature <player> <temperature>
  tempreload:
    description: Reload the temperature plugin configuration
    usage: /tempreload
    permission: temperature.reload
    aliases: [ treload ]

permissions:
  temperature.reload:
    description: Allows reloading the temperature plugin configuration
    default: op