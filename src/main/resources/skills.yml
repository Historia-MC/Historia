chance_no_consume_block_place_builder:
  name: Placeholder
  type: no_consume_block
  description: "Chance to not consume the block when placing it."
  action:
    - block_place
  blocks:
    bricks:
      chance: 0.1
      cooldown: 20 #seconds

bypass_block_place_ladder:
  name: Placeholder
  type: bypass_block_place_restriction
  description: "Ability to place ladders in any territory."
  action:
    - block_place
    - block_destroy
  blocks:
    ladder:
      cooldown: 1
