enhanced_axe_efficiency:
  name: Placeholder
  type: attribute_with_item
  description: "Enhanced ability with an axe."
  material:
    - wooden_axe
  attributes:
    attribute: block_break_speed
    operation: add_number
    factor: 1

enhanced_shovel_efficiency:
  name: Placeholder
  type: attribute_with_item
  description: "Enhanced ability with a shovel."
  material:
    - wooden_shovel
  attributes:
    attribute: block_break_speed
    operation: add_number
    factor: 1

enhanced_pickaxe_efficiency:
  name: Placeholder
  type: attribute_with_item
  description: "Enhanced ability with a pickaxe."
  material:
    - wooden_pickaxe
  attributes:
    attribute: block_break_speed
    operation: add_number
    factor: 1

enhanced_boots:
  name: Placeholder
  type: attribute_with_item
  description: "Enhanced fall resistance boots."
  material:
    - leather_boots
  attributes:
    attribute: safe_fall_distance
    operation: add_number
    factor: 2

enhanced_sword_sharpness:
  name: Placeholder
  type: attribute_on_item
  description: "Enhanced sharpness with a sword."
  material:
    - wooden_sword
  attributes:
    attribute: attack_damage
    operation: add_number
    factor: 1

enhanced_sword_sweeping_edge:
  name: Placeholder
  type: attribute_on_item
  description: "Enhanced sweeping range with a sword."
  material:
    - wooden_sword
  attributes:
    attribute: sweeping_damage_ratio
    operation: add_number
    factor: 2

nametag:
  name: Placeholder
  type: nametag
  description: "Allows the use of nametags."

animal_drops_bones_all:
  name: Placeholder
  type: entity_drop
  description: "Increases bone drops from all animals."
  entity:
    - cow
    - pig
    - sheep
    - chicken
    - horse
    - donkey
    - mule
    - llama
    - rabbit
    - fox
    - wolf
  drops:
    bone:
      min: 1
      max: 2

animal_drops_increase_wool:
  name: Placeholder
  type: entity_drop
  description: "Increases wool drops from sheep."
  entity:
    - sheep
  drops:
    wool:
      min: 0
      max: 6

animal_drops_increase_feather:
  name: Placeholder
  type: entity_drop
  description: "Increases feather drops from chickens."
  entity:
    - chicken
  drops:
    feather:
      min: 0
      max: 5

animal_drops_chicken_shear:
  name: Placeholder
  type: chicken_shear
  description: "Allows shearing of chickens for feathers."

animal_drops_leather:
  name: Placeholder
  type: entity_drop_restriction
  description: "Allows leather drops from animal sources."
  entity:
    - cow
    - horse
    - donkey
    - mule
    - llama
  drops:
    leather:
      min: 1
      max: 3

# TODO: unfortunately we might want to refine this
