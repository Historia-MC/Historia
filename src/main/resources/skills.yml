  description: "Allows breeding of all animal types."
  entity:
    - cow
    - pig
    - chicken
    - sheep
    - horse
    - donkey
    - llama
    - rabbit
    - mooshroom
    - goat
    - wolf
    - cat
    - ocelot
    - axolotl
    - turtle
    - panda
    - fox
    - bee
